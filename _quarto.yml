project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!templates/"

website:
  title: "An Atlas of GLMM Challenges"
  repo-url: https://github.com/NCCC170/glmm-guide
  repo-actions: [source, issue]
  image: "img/nccc_logo.png"
  search: true
  page-navigation: true
  open-graph: true
  
  navbar:
    right:
      - href: https://nccc170.org/
        text: NCCC-170
        target: _blank
      - icon: github
        href: https://github.com/NCCC170/glmm-guide
        target: _blank

  sidebar: 
    width: "300px"
    style: "docked"
    logo: "img/nccc_logo.png"
    logo-href: index.qmd
    pinned: false
    align: center
    search: true
    collapse: true
    contents: 
      - href: chapters/introduction.qmd
        text: Introduction
      - href: chapters/preparation.qmd
        text: Instructions
      - section: "Example 1: Negative Variance"
        contents: 
          - href: chapters/example-01.qmd
            text: "Problem Description"
          - href: chapters/example-01-r.qmd
            text: "R solution"
          - href: chapters/example-01-sas.qmd
            text: "SAS solution"


format:
  html:
    theme: [litera, styles.scss]
    css: styles.css
    toc: true
    code-copy: true
    code-line-numbers: false

    



